# Сангуудын аюулгүй байдлын шинэчлэлийг GitHub автоматаар PR болгон нээнэ.
# PR өөрөө нэгтгэгдэхгүй — бүтээлт амжилттай эсэхийг шалгаад гараар нэгтгэнэ.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # Next.js ба түүний ESLint тохиргоо нэг хувилбартай байх ёстой
      next:
        patterns: ["next", "eslint-config-next"]
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
