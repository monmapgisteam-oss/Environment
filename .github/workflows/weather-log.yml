# Цаг агаарын ажиглалтыг ArcGIS Feature Service рүү хуримтлуулна.
#
# `weather.gov.mn`-ий API нь зөвхөн хамгийн сүүлийн заалтыг буцаадаг тул
# хандлага харах ганц арга бол заалтыг тухай бүрд нь өөрсдөө хадгалах.
# Энэ ажиллагаа сайт бүтээхтэй ХАМААРАЛГҮЙ — тусдаа хуваарьтай.
name: Цаг агаарын архив

# ⚠ ЦАГИЙН ХУВААРЬ УНТРААЛТТАЙ. Танай ArcGIS Enterprise
# (environment.ub.gov.mn) нь интернетээс ХААЛТТАЙ: GitHub-ийн сервер 443
# порт руу холбогдож чаддаггүй (UND_ERR_CONNECT_TIMEOUT, 2026-09-11-нд
# батлагдсан). Цаг агаарын API нь харин нээлттэй тул алдаа зөвхөн ArcGIS
# талд гардаг.
#
# Тиймээс архивыг `scripts\log-weather.cmd`-ээр ДОТООД СҮЛЖЭЭНД,
# Task Scheduler-ээр ажиллуулна. Энэ ажиллагааг цагийн хуваарьтай
# үлдээвэл цаг тутам уначихаад мэйл цацна.
#
# Серверийг гаднаас нээх, эсвэл дотоод сүлжээнд self-hosted runner
# суулгасан тохиолдолд доорх `schedule`-ийг сэргээнэ.
on:
  # schedule:
  #   - cron: "7 * * * *"
  # Гараар турших боломж
  workflow_dispatch:

# Нэг л ажиллагаа явна: давхарлан ажиллавал ижил заалт хоёр удаа
# бичигдэж болзошгүй (давхардлын шалгалт нь бичихээс ӨМНӨ уншдаг).
concurrency:
  group: weather-log
  cancel-in-progress: false

jobs:
  log:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Заалтыг архивлах
        env:
          WEATHER_LAYER_URL: ${{ secrets.WEATHER_LAYER_URL }}
          # Аппын токен (OAuth). Хэрэглэгчийн бүртгэлээр орох бол оронд нь
          # ARCGIS_USER / ARCGIS_PASSWORD тавьж болно — скрипт хоёуланг дэмжинэ.
          ARCGIS_CLIENT_ID: ${{ secrets.ARCGIS_CLIENT_ID }}
          ARCGIS_CLIENT_SECRET: ${{ secrets.ARCGIS_CLIENT_SECRET }}
          ARCGIS_USER: ${{ secrets.ARCGIS_USER }}
          ARCGIS_PASSWORD: ${{ secrets.ARCGIS_PASSWORD }}
          # `capital` (анхдагч, 7 станц) эсвэл `all` (317 станц)
          WEATHER_SCOPE: capital
          # Давхарга нь өөрөө гарын үсэг зурсан TLS гэрчилгээтэй хост дээр
          # (environment.ub.gov.mn). Шалгалтыг унтраахын оронд серверийн
          # гэрчилгээг итгэмжлэгдсэн CA болгож бэхэлнэ.
          NODE_EXTRA_CA_CERTS: scripts/environment-ub-gov-mn.pem
        run: node scripts/log-weather.mjs
